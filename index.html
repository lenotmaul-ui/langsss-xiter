<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ERLAN LUXE PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cinzel:wght@700&family=Orbitron:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://wallpapercave.com/wp/wp2757874.gif'); 
            --glass: rgba(10, 10, 10, 0.75);
            --neon-green: #00ff88;
            --neon-blue: #00f2ff;
            --danger: #ff3b30;
            --border-luxe: rgba(255,255,255,0.12);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; }
        
        body { 
            background: #000;
            background-image: radial-gradient(circle at center, rgba(0,255,136,0.08) 0%, transparent 70%), linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; padding: 40px 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        .premium-container {
            width: 92vw; max-width: 390px; background: var(--glass);
            backdrop-filter: blur(40px) saturate(200%); border: 1px solid var(--border-luxe); 
            border-radius: 40px; padding: 30px 25px 20px 25px; z-index: 10; margin-bottom: 10px;
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.03); padding: 8px 16px;
            border-radius: 100px; border: 1px solid var(--border-luxe);
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2px; color: #888;
        }

        .dot { 
            width: 7px; height: 7px; border-radius: 50%; background: var(--neon-green); 
            box-shadow: 0 0 12px var(--neon-green); animation: pulse-glow 2s infinite; 
        }

        @keyframes pulse-glow { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .brand .title { 
            font-family: 'Orbitron', sans-serif; font-size: 2rem; letter-spacing: 6px; font-weight: 900; 
            text-align: center; margin: 20px 0; text-shadow: 0 0 15px var(--neon-green);
        }
        .brand span { color: var(--neon-green); }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: rgba(255,255,255,0.04); padding: 6px; border-radius: 20px; }
        .tab-trigger { flex: 1; padding: 12px; border: none; background: transparent; color: #555; font-size: 0.65rem; font-weight: 800; cursor: pointer; border-radius: 16px; }
        .tab-trigger.active { background: #fff; color: #000; }

        .input-wrap { position: relative; width: 100%; margin-bottom: 12px; }
        input { width: 100%; padding: 18px 18px 18px 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-luxe); border-radius: 18px; color: #fff; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

        .btn-prime { 
            width: 100%; padding: 18px; background: #fff; color: #000; border: none; border-radius: 20px; 
            font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; 
        }

        .terminal {
            margin-top: 20px; height: 100px; background: rgba(0,0,0,0.8); border-radius: 20px;
            padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
            color: var(--neon-green); border: 1px solid var(--border-luxe); overflow-y: auto;
        }

        .social-group { display: flex; justify-content: center; gap: 25px; margin-top: 20px; }
        svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <div class='premium-container' id='authWrap'>
        <div style="text-align:center"><div class='status-badge'><div class='dot'></div> System Ready</div></div>
        <div class='brand'><div class='title'>ERLAN<span>LUXE</span></div></div>
        
        <div class='nav-tabs'>
            <button class='tab-trigger active' onclick='setAuthMode("login")'>MASUK</button>
            <button class='tab-trigger' onclick='setAuthMode("register")'>DAFTAR</button>
            <button class='tab-trigger' onclick='setAuthMode("license")'>LISENSI</button>
        </div>
        
        <div id='userInputs'>
            <div class='input-wrap'>
                <span class='input-icon'>👤</span>
                <input type='text' id='user' placeholder='Username'>
            </div>
            <div class='input-wrap' id="passGroup">
                <span class='input-icon'>🔒</span>
                <input type='password' id='pass' placeholder='Password'>
            </div>
        </div>

        <div id='keyGroup' style='display:none;' class='input-wrap'>
            <span class='input-icon'>🔑</span>
            <input type='text' id='license' placeholder='License Key'>
        </div>

        <button class='btn-prime' id='mainAuthBtn' onclick='doAuth()'>LOGIN TO SYSTEM</button>

        <div class="terminal" id="logArea">
            > Initializing Security...<br>
            > Waiting for authentication...
        </div>

        <div class="social-group">
            <a href="#" style="color:#25D366">WA</a>
            <a href="#" style="color:#fff">TT</a>
            <a href="#" style="color:#5865F2">DC</a>
        </div>
    </div>

    <div class='premium-container' id='mainPanel' style='display:none;'>
        <div class='status-badge'><div class='dot'></div> SYSTEM ACTIVE</div>
        <div class='brand'><div class='title' style="font-size:1.2rem">LUXE <span>PANEL</span></div></div>
        
        <div style="display:grid; gap:10px;">
            <button class="btn-prime" onclick="alert('Starting Emulator...')">Jalankan Emulator</button>
            <button class="btn-prime" onclick="alert('Aimbot ON')" style="background:rgba(255,255,255,0.1); color:#fff;">Aimbot Config</button>
            <button class="btn-prime" onclick="location.reload()" style="color:red;">LOGOUT</button>
        </div>
    </div>

    <script>
        function setAuthMode(mode) {
            const btn = document.getElementById('mainAuthBtn');
            const passGroup = document.getElementById('passGroup');
            const keyGroup = document.getElementById('keyGroup');
            
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if(mode === 'license') {
                passGroup.style.display = 'none';
                keyGroup.style.display = 'block';
                btn.innerText = "ACTIVATE LICENSE";
            } else if(mode === 'register') {
                passGroup.style.display = 'block';
                keyGroup.style.display = 'block';
                btn.innerText = "CREATE ACCOUNT";
            } else {
                passGroup.style.display = 'block';
                keyGroup.style.display = 'none';
                btn.innerText = "LOGIN TO SYSTEM";
            }
        }

        function doAuth() {
            const u = document.getElementById('user').value;
            const log = document.getElementById('logArea');
            
            if(!u) return alert("Isi username!");

            log.innerHTML += `<br>> Authenticating ${u}...`;
            
            // Simulasi proses login
            setTimeout(() => {
                log.innerHTML += "<br>> Connection Established...";
                setTimeout(() => {
                    log.innerHTML += "<br>> <span style='color:#00ff88'>ACCESS GRANTED!</span>";
                    setTimeout(() => {
                        document.getElementById('authWrap').style.display = 'none';
                        document.getElementById('mainPanel').style.display = 'block';
                    }, 1000);
                }, 1000);
            }, 800);
        }
    </script>
</body>
</html>
