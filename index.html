<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ERLAN LUXE PREMIUM</title>
    <link href=""https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cinzel:wght@700&family=Orbitron:wght@700&family=JetBrains+Mono:wght@500;700&display=swap"" rel=""stylesheet"">
    <style>
        :root {{
            --bg-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070');
            --glass: rgba(10, 10, 10, 0.75);
            --neon-green: #00ff88;
            --neon-blue: #00f2ff;
            --danger: #ff3b30;
            --border-luxe: rgba(255,255,255,0.12);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }}
        * {{ box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; }}
        
        /* AGAR BODY BISA DI-SCROLL */
        body {{ 
            background: #000;
            background-image: radial-gradient(circle at center, rgba(0,255,136,0.08) 0%, transparent 70%), linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; 
            min-height: 100vh; /* Menggunakan min-height agar bisa memanjang */
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; /* Mulai dari atas agar scroll natural */
            padding: 40px 0; /* Memberi ruang saat scroll ke bawah */
            overflow-y: auto; /* MENGAKTIFKAN SCROLL VERTIKAL */
            -webkit-overflow-scrolling: touch;
        }}

        #particle-canvas {{ position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }}
        
        @keyframes luxeFade {{
            from {{ opacity: 0; transform: scale(0.97) translateY(10px); }}
            to {{ opacity: 1; transform: scale(1) translateY(0); }}
        }}
        .fade-in {{ animation: luxeFade 0.4s ease-out forwards; }}

        .premium-container {{
    width: 92vw; max-width: 390px; 
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(200%);
    border: 1px solid var(--border-luxe); 
    border-radius: 40px; 
    padding: 30px 25px 20px 25px; /* Padding bawah dikurangi dari 35px ke 20px */
    z-index: 10;
    margin-bottom: 10px; /* Jarak luar bawah diperkecil */
}}

        /* Scrollbar Styling agar terlihat premium */
        body::-webkit-scrollbar {{ width: 4px; }}
        body::-webkit-scrollbar-track {{ background: transparent; }}
        body::-webkit-scrollbar-thumb {{ background: var(--neon-green); border-radius: 10px; }}

        .status-wrapper {{ display: flex; justify-content: center; margin-bottom: 25px; }}
        .status-badge {{
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.03); padding: 8px 16px;
            border-radius: 100px; border: 1px solid var(--border-luxe);
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
            color: #888; text-transform: uppercase;
        }}
        .dot {{ 
            width: 7px; height: 7px; border-radius: 50%; 
            background: var(--neon-green); 
            box-shadow: 0 0 12px var(--neon-green);
            animation: pulse-glow 2s infinite; 
        }}
        @keyframes pulse-glow {{ 0% {{ opacity: 0.4; transform: scale(0.9); }} 50% {{ opacity: 1; transform: scale(1.1); }} 100% {{ opacity: 0.4; transform: scale(0.9); }} }}
        
        .brand {{ text-align: center; margin-bottom: 30px; position: relative; }}
        .brand .title {{ 
            font-family: 'Orbitron', sans-serif; 
            font-size: 2rem; 
            letter-spacing: 6px; 
            font-weight: 900; 
            color: #fff;
            position: relative;
            display: inline-block;
            text-shadow: 0.05em 0 0 rgba(0, 255, 136, 0.75),
                        -0.025em -0.05em 0 rgba(0, 242, 255, 0.75),
                        0.025em 0.05em 0 rgba(255, 59, 48, 0.75);
            animation: glitch 500ms infinite;
        }}
        .brand .title span {{ 
            background: none;
            -webkit-text-fill-color: var(--neon-green);
            filter: drop-shadow(0 0 15px var(--neon-green));
            margin-left: 5px;
        }}
        @keyframes glitch {{
            0% {{ text-shadow: 0.05em 0 0 rgba(0,255,136,.75), -0.05em -0.025em 0 rgba(0,242,255,.75), -0.025em 0.05em 0 rgba(255,59,48,.75); }}
            50% {{ text-shadow: 0.025em 0.05em 0 rgba(0,255,136,.75), 0.05em 0 0 rgba(0,242,255,.75), 0 -0.05em 0 rgba(255,59,48,.75); }}
            100% {{ text-shadow: -0.025em 0 0 rgba(0,255,136,.75), -0.025em -0.025em 0 rgba(0,242,255,.75), -0.025em -0.05em 0 rgba(255,59,48,.75); }}
        }}

        @keyframes slideUp {{ from {{ opacity: 0; transform: translateY(40px); }} to {{ opacity: 1; transform: translateY(0); }} }}
        .nav-tabs {{ display: flex; gap: 8px; margin-bottom: 25px; background: rgba(255,255,255,0.04); padding: 6px; border-radius: 20px; }}
        
        .tab-trigger {{ flex: 1; padding: 12px; border: none; background: transparent; color: #555; font-size: 0.65rem; font-weight: 800; cursor: pointer; transition: 0.3s; border-radius: 16px; }}
        .tab-trigger:hover:not(.active) {{ color: #aaa; background: rgba(255,255,255,0.05); }}
        .tab-trigger.active {{ background: #fff; color: #000; box-shadow: 0 8px 20px rgba(255,255,255,0.15); }}
        
        .input-wrap {{ position: relative; width: 100%; margin-bottom: 12px; }}
        input {{ width: 100%; padding: 18px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-luxe); border-radius: 18px; color: #fff; font-size: 0.85rem; transition: 0.3s; }}
        input:focus {{ border-color: var(--neon-green); background: rgba(0,255,136,0.05); box-shadow: 0 0 15px rgba(0,255,136,0.1); }}
        /* Style Tambahan untuk Ikon Input */
.input-wrap {{position: relative;
    display: flex;
    align-items: center;
}}

.input-icon {{
    position: absolute;
    left: 15px;
    z-index: 10;
    color: rgba(255, 255, 255, 0.3);
    /* Gunakan flexbox untuk memastikan ikon pas di tengah secara vertikal */
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%; /* Menyesuaikan tinggi input agar center */
    top: 0; /* Pastikan mulai dari atas agar align-items: center bekerja */
    pointer-events: none;
    transition: 0.3s;
}}

/* Menghapus gaya box lama dan menggantinya dengan gaya minimalis */
.minimal-info-row {{display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 15px 0 25px 0;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
}}

.min-card {{text - align: center;
}}

.min-card span {{display: block;
    font-size: 0.5rem;
    color: var(--neon-blue);
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 4px;
    opacity: 0.8;
}}

.min-card b {{font - family: 'JetBrains Mono', monospace;
    font-size: 0.9rem; /* Ukuran teks lebih kecil & rapi */
    color: #fff;
    text-transform: uppercase;
}}

#liveClock {{font - size: 0.75rem !important; /* Jam dibuat sedikit lebih kecil agar tidak makan tempat */
    color: rgba(255,255,255,0.7);
}}

.input-icon svg {{
    width: 18px;
    height: 18px;
    display: block; /* Menghilangkan whitespace tambahan pada SVG */
}}
/* Efek saat input difokuskan */
input:focus + .input-icon, 
input:not(:placeholder-shown) + .input-icon {{color: var(--neon-green);
    filter: drop-shadow(0 0 5px var(--neon-green));
}}
        .eye-btn {{ position: absolute; right: 18px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #444; z-index: 5; transition: 0.3s; }}
        .eye-btn svg {{ width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }}
        .auth-options {{display: flex; 
    justify-content: flex-start; 
    margin-top: 5px;    /* Ubah dari 15px menjadi 5px */
    margin-bottom: 10px; /* Ubah dari 20px menjadi 10px */
    padding-left: 5px; 
}}

/* Save login Button */
       .auth-options {{ 
            display: flex; 
            justify-content: flex-start; 
            margin-top: 15px; /* Menambah jarak atas agar tidak menempel */
            margin-bottom: 20px; 
            padding-left: 5px; 
        }}

        .remember-luxe {{ 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer; 
            user-select: none; 
        }}

        /* Style Kotak Centang */
        .custom-check {{
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-luxe);
            border-radius: 5px;
            position: relative;
            transition: all 0.3s;
            background: rgba(255,255,255,0.02);
        }}

        /* Menghilangkan input asli dan memberi efek saat dicentang */
        #remMe {{ display: none; }}

        #remMe:checked + .remember-luxe .custom-check {{
            background: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }}

        /* Membuat tanda centang (v) di dalam kotak */
        #remMe:checked + .remember-luxe .custom-check::after {{
            content: '✓';
            position: absolute;
            color: #000;
            font-size: 12px;
            font-weight: 900;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }}

        .remember-text {{ 
            font-size: 0.65rem; 
            color: #888; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.3s;
        }}

        #remMe:checked + .remember-luxe .remember-text {{ 
            color: var(--neon-green); 
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }}
        .btn-prime {{ 
            position: relative; width: 100%; padding: 18px; background: #fff; color: #000; 
            border: none; border-radius: 20px; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; 
            transition: var(--transition); overflow: hidden; z-index: 1;
        }}
        .btn-prime:hover:not(:disabled) {{ transform: translateY(-4px); box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2); filter: brightness(1.1); }}
        .btn-prime:active {{ transform: scale(0.96); }}

.social-group {{
     display: flex;
     justify-content: center;
     gap: 25px;
     margin-top: 15px; /* Dikurangi dari 30px agar naik lebih dekat ke tombol/input */
}}
 .support-link {{
     display: flex;
     align-items: center;
     justify-content: center;
     text-decoration: none;
     transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
 }}

 /* WhatsApp */
 .support-link.wa svg {{
     width: 32px; height: 32px;
     fill: #25D366;
     filter: drop-shadow(0 0 8px rgba(37, 211, 102, 0.5));
 }}

 /* TikTok */
 .support-link.tt svg {{
     width: 32px; height: 32px;
     fill: #FFFFFF;
     filter: drop-shadow(-2px -1px 0px #ff0050) 
             drop-shadow(2px 1px 0px #00f2ea);
 }}

 /* Discord */
 .support-link.dc svg {{
     width: 32px; height: 32px;
     fill: #5865F2;
     filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.5));
 }}

 .support-link:hover {{
     transform: scale(1.2) translateY(-5px);
 }}
        #premium-loader {{ position: fixed; inset: 0; background: #000; z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }}
        .l-ring {{ width: 60px; height: 60px; position: relative; border: 1px solid rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; }}
        .l-ring::after {{ content: ''; position: absolute; inset: -3px; border: 2px solid transparent; border-top: 2px solid var(--neon-green); border-radius: 50%; filter: drop-shadow(0 0 8px var(--neon-green)); animation: luxe-spin 1s linear infinite; }}
        @keyframes luxe-spin {{ 0% {{ transform: rotate(0deg); }} 100% {{ transform: rotate(360deg); }} }}
        .info-grid {{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }}
        .info-card {{ background: rgba(255,255,255,0.02); border: 1px solid var(--border-luxe); border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s; }}
        .info-card:hover {{ background: rgba(255,255,255,0.05); transform: translateY(-2px); }}
        
        .info-card span {{ font-size: 0.5rem; color: #555; display: block; text-transform: uppercase; margin-bottom: 5px; font-weight: 800; letter-spacing: 1px; }}
        .info-card b {{ font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #fff; letter-spacing: 0.5px; font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,0.2); }}
        #initBtn, #aimBtn, #neckBtn, #shldBtn, #espBtn {{ background: rgba(255,255,255,0.03) !important; border: 1px solid rgba(255,255,255,0.08) !important; color: #aaa; border-radius: 18px; font-size: 0.65rem; transition: 0.3s; }}
        #initBtn:hover:not(:disabled), #aimBtn:hover:not(:disabled), #neckBtn:hover:not(:disabled), #shldBtn:hover:not(:disabled), #espBtn:hover:not(:disabled) {{ border-color: var(--neon-green) !important; color: #fff !important; background: rgba(0, 255, 136, 0.08) !important; box-shadow: 0 0 25px rgba(0, 255, 136, 0.2); transform: translateY(-3px); }}

/* TERMINAL CONSOLE */
       .terminal {{
    margin-top: 20px; /* TAMBAHKAN INI UNTUK MEMBERI JARAK */
    height: 130px;
    background: linear-gradient(
        180deg, 
        rgba(0, 255, 136, 0.02) 0%, 
        rgba(0, 0, 0, 0.9) 100%
    );
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    border: 1px solid var(--border-luxe);
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
 }}

/* Menambahkan efek garis-garis monitor (Scanlines) */
.terminal::before {{
    content: "" "";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
    opacity: 0.3;
}}

/* Scrollbar Futuristik: Hanya muncul saat di-scroll (Auto-hide) */
.terminal::-webkit-scrollbar {{
    width: 2px;
}}

.terminal::-webkit-scrollbar-track {{
    background: transparent;
}}

.terminal::-webkit-scrollbar-thumb {{
    background: linear-gradient(to bottom, transparent, var(--neon-green), transparent);
    border-radius: 10px;
    box-shadow: 0 0 10px var(--neon-green);
}}
         /* GAYA TOMBOL TONG SAMPAH */
.terminal-header {{
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 50;
}}

.trash-btn {{
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.3); /* Warna redup saat tidak disentuh */
    width: 32px;
    height: 32px;
    border-radius: 50%; /* Bulat sempurna agar terlihat elegan */
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(4px);
}}

.trash-btn:hover {{
    background: rgba(255, 59, 48, 0.15); /* Merah transparan */
    border-color: var(--danger);
    color: var(--danger);
    transform: rotate(15deg) scale(1.1); /* Sedikit miring saat hover */
    box-shadow: 0 0 15px rgba(255, 59, 48, 0.2);
}}

.trash-btn svg {{
    width: 15px;
    height: 15px;
    stroke-width: 1.5; /* Garis ikon lebih tipis agar mewah */
}}
</style>
</head>

    <script>
    let currentMode = 'login';
    let aimState = false, neckState = false, shldState = false, isFloating = false;
    let particles = [];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    window.onload = () => {{
        loadBindings();
        const u = localStorage.getItem('erlan_user'), p = localStorage.getItem('erlan_pass');
        if (u && p) {{
            document.getElementById('user').value = u;
            document.getElementById('pass').value = p;
            document.getElementById('remMe').checked = true;
        }}
        startLiveClock();
        initParticles();
        animateParticles();
    }};

   function startLiveClock() {{
    setInterval(() => {{
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 0);
        const diff = now - startOfYear;
        const oneDay = 1000 * 60 * 60 * 24;
        
        // Menghitung Hari, Jam, Menit, Detik
        const dayOfYear = Math.floor(diff / oneDay);
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');

        // Format pendek agar pas di dalam box (Tanpa Tahun/Y)
        const timeStr = `${{dayOfYear}}D ${{hours}}H ${{minutes}}M ${{seconds}}S`;
        
        const clockEl = document.getElementById('liveClock');
        if (clockEl) {{
            clockEl.innerText = timeStr;
        }}
    }}, 1000);
}}

   function setAuthMode(mode) {{
        currentMode = mode;
        const btnMain = document.getElementById('mainAuthBtn');
        const userInputs = document.getElementById('userInputs');
        const keyGroup = document.getElementById('keyGroup');
        const remControl = document.getElementById('rememberControl');

        document.querySelectorAll('.tab-trigger').forEach(btn => {{
            const btnText = btn.innerText.toLowerCase();
            const isActive = (mode === 'login' && btnText.includes('masuk')) || 
                             (mode === 'register' && btnText.includes('daftar')) || 
                             (mode === 'license' && btnText.includes('lisensi'));
            btn.classList.toggle('active', isActive);
        }});

        if (mode === 'license') {{
            userInputs.style.display = 'none';
            keyGroup.style.display = 'block';
            if (remControl) remControl.style.display = 'none';
            btnMain.innerText = 'ACTIVATE LICENSE';
        }} else if (mode === 'register') {{
            userInputs.style.display = 'block';
            keyGroup.style.display = 'block';
            if (remControl) remControl.style.display = 'none';
            btnMain.innerText = 'CREATE ACCOUNT';
        }} else {{
            userInputs.style.display = 'block';
            keyGroup.style.display = 'none';
            if (remControl) remControl.style.display = 'flex';
            btnMain.innerText = 'LOGIN TO SYSTEM';
        }}
        document.getElementById('authMsg').innerText = '';
    }}

function doAuth() {{
        const u = document.getElementById('user').value, 
              p = document.getElementById('pass').value, 
              k = document.getElementById('license').value, 
              r = document.getElementById('remMe').checked;
        
        const msgElement = document.getElementById('authMsg');

        // --- FUNGSI INTERNAL UNTUK UPDATE AUTH MSG ---
        const updateAuthMsg = (text, color) => {{
            msgElement.innerText = text;
            msgElement.style.color = color;
        }};

        // --- LOG AWAL PADA LOGIN PAGE ---
        updateAuthMsg(""INITIALIZING SECURITY PROTOCOL..."", ""var(--neon-blue)"");
        
        setTimeout(() => {{
            updateAuthMsg(""CONNECTING TO ERLAN SERVER..."", ""var(--neon-blue)"");
        }}, 400);

        setTimeout(() => {{
            updateAuthMsg(""VERIFYING CREDENTIALS: "" + u.toUpperCase(), ""#ffffff"");
            
            // --- MULAI FETCH SETELAH LOG SELESAI ---
            const bodyData = ""action="" + currentMode + ""&username="" + encodeURIComponent(u) + ""&password="" + encodeURIComponent(p) + ""&license="" + encodeURIComponent(k);

            fetch('/api/auth', {{ 
                method: 'POST', 
                headers: {{ 'Content-Type': 'application/x-www-form-urlencoded' }}, 
                body: bodyData 
            }})
            .then(res => res.json())
            .then(data => {{
                if (data.status === 'success') {{
                    updateAuthMsg(""ACCESS GRANTED!"", ""var(--neon-green)"");
                    
                    if (r) {{ localStorage.setItem('erlan_user', u); localStorage.setItem('erlan_pass', p); }}
                    
                    setTimeout(() => {{
                        // --- TAMBAHAN: UPDATE NAMA USER KE UI ---
                        document.getElementById('activeUser').innerText = (data.user || u).toUpperCase();
                        
                        document.getElementById('authWrap').style.display = 'none';
                        document.getElementById('premium-loader').style.display = 'flex';
                        
                        setTimeout(() => {{ 
                            document.getElementById('premium-loader').style.display = 'none'; 
                            document.getElementById('mainPanel').style.display = 'block'; 
                            
                            if (typeof addLog === 'function') {{
                                addLog(""WELCOME TO ERLANLUXE!!"", ""var(--neon-green)"");
                            }}
                            
                            // --- TAMBAHAN: AKTIFKAN STATUS HD-PLAYER ---
                            startStatusDetection();
                            
                        }}, 2000);
                    }}, 800);

                }} else {{ 
                    updateAuthMsg(""GAGAL: "" + data.message.toUpperCase(), ""var(--danger)"");
                }}
            }})
            .catch(err => {{
                updateAuthMsg(""CONNECTION ERROR"", ""var(--danger)"");
            }});

        }}, 1000);
    }}

    function togglePass() {{
        const p = document.getElementById('pass'), icon = document.getElementById('eyeIcon'), btn = document.getElementById('eyeToggle');
        const isPass = p.type === 'password';
        p.type = isPass ? 'text' : 'password';
        btn.style.color = isPass ? 'var(--neon-green)' : '#444';
        icon.innerHTML = isPass ? '<path d=""M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z""></path><circle cx=""12"" cy=""12"" r=""3""></circle>' : '<path d=""M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24""></path><line x1=""1"" y1=""1"" x2=""23"" y2=""23""></line>';
    }}

    function parseExpiry(expiry) {{ 
        if (!expiry || expiry === ""0"") return ""LIFETIME""; 
        const date = new Date(parseInt(expiry) * 1000); 
        return date.toLocaleDateString('id-ID', {{ day: '2-digit', month: 'short', year: 'numeric' }}).toUpperCase(); 
    }}

   function startStatusDetection() {{
    const dot = document.getElementById('luxeStatusDot');
    const txt = document.getElementById('luxeStatusText');
    const cpu = document.getElementById('cpuLoad');
    const ping = document.getElementById('pingMs');

    setInterval(() => {{
        // Cek apakah Panel Utama sedang aktif/terbuka
        if (document.getElementById('mainPanel').style.display !== 'none') {{
            
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {{
                    if (data && data.online) {{
                        // Jika Server/HD-Player Online
                        dot.style.background = 'var(--neon-green)';
                        dot.style.boxShadow = '0 0 12px var(--neon-green)';
                        txt.innerText = 'HD-PLAYER ONLINE';
                        txt.style.color = 'var(--neon-green)';
                    }} else {{
                        // Jika Offline
                        dot.style.background = 'var(--danger)';
                        dot.style.boxShadow = '0 0 12px var(--danger)';
                        txt.innerText = 'HD-PLAYER OFFLINE';
                        txt.style.color = 'var(--danger)';
                    }}
                }})
                .catch(() => {{
                    // Penanganan jika API tidak merespon (Error koneksi)
                    txt.innerText = 'SYSTEM ERROR';
                    dot.style.background = 'var(--danger)';
                }});

            // Simulasi Statistik Real-time
            if (cpu) cpu.innerText = Math.floor(Math.random() * 15 + 5) + ""%"";
            if (ping) ping.innerText = Math.floor(Math.random() * 20 + 10) + ""ms"";
        }}
    }}, 3000); // Mengecek setiap 3 detik
}}

    function setRGB(color) {{
        document.documentElement.style.setProperty('--neon-green', color);
        addLog(""THEME SYNCED: "" + color.toUpperCase(), color);
        playSfx();
    }}
function clearLogs() {{
    playSfx(); // Menjalankan suara klik Anda yang sudah ada
    document.getElementById('logArea').innerHTML = ''; // Menghapus isi log
    addLog(""CONSOLE CLEARED"", ""var(--danger)""); // Memberi notifikasi log baru

    function switchTab(t) {{
        document.getElementById('contentMain').style.display = t === 'main' ? 'block' : 'none';
        document.getElementById('contentSettings').style.display = t === 'settings' ? 'block' : 'none';
        document.getElementById('tabMain').classList.toggle('active', t === 'main');
        document.getElementById('tabSettings').classList.toggle('active', t === 'settings');
        addLog(""SWITCHED TO "" + t.toUpperCase(), ""var(--neon-green)"");

    function toggleFloating() {{
        isFloating = !isFloating;
        const panel = document.getElementById('mainPanel');
        if (isFloating) {{
            panel.style.width = '200px';
            panel.style.padding = '15px';
            document.getElementById('logArea').style.display = 'none';
            addLog(""FLOATING MODE ON"", ""var(--neon-green)"");
        }} else {{
            panel.style.width = '92vw';
            panel.style.padding = '35px 25px';
            document.getElementById('logArea').style.display = 'block';

    }}

    function postAction(endpoint, name, state) {{
        fetch(endpoint, {{ method: 'POST' }}).then(r => r.text().then(rawData => {{
            const parts = rawData.split('|'); 
            const colorMap = {{ 'red': 'var(--danger)', 'yellow': '#ffcc00', 'white': '#ffffff' }};
            addLog(parts.length > 1 ? parts[1] : rawData, colorMap[parts[0]?.toLowerCase()] || 'var(--neon-green)');
        }})).catch(() => addLog('KONEKSI TERPUTUS', 'var(--danger)')); 
    }}

    function startSyncAction() {{
    playSfx();
    
    // Tahap 1: Inisialisasi
    addLog(""MENGHUBUNGKAN KE EMULATOR..."", ""var(--neon-blue)"");

    // Beri jeda 1.5 detik sebelum melakukan fetch (proses seolah-olah sedang mencari)
    setTimeout(() => {{
        addLog(""MENYINKRONKAN DATA SECURITY..."", ""var(--neon-blue)"");
        
        // Tahap 2: Eksekusi Fetch
        fetch('/openemulator', {{ method: 'POST' }})
        .then(() => {{
            // Beri jeda lagi setelah fetch berhasil agar tidak terlalu cepat
            setTimeout(() => {{
                addLog(""EMULATOR BERHASIL DIJALANKAN!"", ""var(--neon-green)"");
                
                // Opsional: Update status badge menjadi online
                const statusText = document.getElementById('luxeStatusText');
                if(statusText) statusText.innerText = ""SYSTEM ACTIVE / ONLINE"";
            }}, 1000);
        }})
        .catch(() => {{
            setTimeout(() => {{
                addLog(""GAGAL MENJALANKAN EMULATOR"", ""var(--danger)"");
            }}, 1000);
        }});
        
    }}, 1500); 
}}

    function toggleAimbot() {{ playSfx(); aimState = !aimState; postAction(aimState ? '/aimbotload' : '/aimbotoff', 'AIM', aimState); document.getElementById('aimBtn').innerText = aimState ? 'Aimbot: ON' : 'Aimbot: OFF'; }}
    function toggleNeck() {{ playSfx(); neckState = !neckState; postAction(neckState ? '/aimbotneck' : '/aimbotneckoff', 'NECK', neckState); document.getElementById('neckBtn').innerText = neckState ? 'Neck: ON' : 'Neck: OFF'; }}
    function toggleShoulder() {{ playSfx(); shldState = !shldState; postAction(shldState ? '/aimbotshoulder' : '/aimbotshoulderoff', 'SHLD', shldState); document.getElementById('shldBtn').innerText = shldState ? 'Shoulder: ON' : 'Shoulder: OFF'; }}

   function addLog(msg, color) {{
    const area = document.getElementById('logArea'); 
    const line = document.createElement('div'); 
    line.style.color = color;
    line.style.marginBottom = '4px'; // Jarak antar baris
    area.appendChild(line);

    let i = 0; 
    const text = '> ' + msg;

    function type() {{ 
        if (i < text.length) {{ 
            line.innerHTML += text.charAt(i); 
            i++; 
            
            // AUTO SCROLL: Memaksa scroll ke posisi paling bawah setiap satu karakter muncul
            area.scrollTop = area.scrollHeight; 
            
            setTimeout(type, 15); // Kecepatan mengetik
        }} else {{
            // Pastikan sekali lagi di akhir teks sudah di posisi paling bawah
            area.scrollTop = area.scrollHeight;
        }}
    }}
    type();
}}
    function playSfx() {{ 
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); 
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.003, audioCtx.currentTime); 
        osc.connect(gain); gain.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + 0.03); 
    }}

    const canvas = document.getElementById('particle-canvas'), ctx = canvas.getContext('2d');
    function resize() {{ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }}
    window.addEventListener('resize', resize); resize();

    class Particle {{
        constructor() {{ 
            this.x = Math.random() * canvas.width; 
            this.y = Math.random() * canvas.height; 
            this.size = Math.random() * 2 + 0.5; 
            this.speedX = Math.random() * 0.8 - 0.4; 
            this.speedY = Math.random() * 0.8 - 0.4; 
            this.color = 'rgba(0, 255, 136, ' + (Math.random() * 0.4 + 0.1) + ')'; 
        }}
        update() {{ 
            this.x += this.speedX; this.y += this.speedY; 
            if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
        }}
        draw() {{ ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }}
    }}
    function initParticles() {{ for (let i = 0; i < 60; i++) particles.push(new Particle()); }}
    function animateParticles() {{ ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => {{ p.update(); p.draw(); }}); requestAnimationFrame(animateParticles); }}
    
    function loadBindings() {{ /* Placeholder as requested */ }}
    </script>
