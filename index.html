<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ERLAN LUXE PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://wallpapercave.com/wp/wp2757874.gif'); 
            --glass: rgba(10, 10, 10, 0.8);
            --neon-green: #00ff88;
            --neon-blue: #00f2ff;
            --border-luxe: rgba(255,255,255,0.12);
        }
        
        body { 
            background: #000;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden;
        }

        .premium-container {
            width: 92vw; max-width: 380px; background: var(--glass);
            backdrop-filter: blur(25px); border: 1px solid var(--border-luxe);
            border-radius: 35px; padding: 25px; z-index: 10;
        }

        /* Logic Styles */
        .terminal {
            margin-top: 15px; height: 120px; background: rgba(0,0,0,0.9);
            border-radius: 15px; padding: 12px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: var(--neon-green); border: 1px solid var(--border-luxe);
            overflow-y: auto; box-shadow: inset 0 0 10px #000;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .info-card { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 15px; text-align: center; border: 1px solid var(--border-luxe); }
        .info-card span { display: block; font-size: 0.5rem; color: #888; margin-bottom: 4px; }
        .info-card b { font-size: 0.8rem; color: #fff; }

        .btn-prime {
            width: 100%; padding: 15px; background: #fff; color: #000; border: none;
            border-radius: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s; margin-bottom: 8px;
        }
        .btn-prime:hover { transform: scale(1.02); background: var(--neon-green); }
        
        .active-status { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
    </style>
</head>
<body>

    <div class="premium-container" id="authWrap">
        <h2 style="text-align:center; font-family:'Orbitron'; letter-spacing:3px;">ERLAN<span style="color:var(--neon-green)">LUXE</span></h2>
        <div style="margin-top:20px;">
            <input type="text" id="user" placeholder="Username" style="width:100%; padding:15px; margin-bottom:10px; background:rgba(0,0,0,0.5); border:1px solid var(--border-luxe); border-radius:12px; color:#fff;">
            <button class="btn-prime" onclick="processLogin()">LOGIN TO SYSTEM</button>
        </div>
        <div class="terminal" id="loginLog">> Waiting for authentication...</div>
    </div>

    <div class="premium-container" id="mainPanel" style="display:none;">
        <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--neon-blue); margin-bottom:10px;">
            <span>CPU: <span id="cpuLoad">0%</span></span>
            <span>PING: <span id="pingMs">12ms</span></span>
            <span>RAM: 24MB</span>
        </div>

        <div class="info-grid">
            <div class="info-card"><span>OPERATOR</span><b id="displayUser">USER</b></div>
            <div class="info-card"><span>UPTIME</span><b id="liveClock">00:00:00</b></div>
        </div>

        <button class="btn-prime" id="btnEmu" onclick="toggleLogic('emu')">Jalankan Emulator</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn-prime" id="btnAim" onclick="toggleLogic('aim')">Aimbot: OFF</button>
            <button class="btn-prime" id="btnEsp" onclick="toggleLogic('esp')">ESP: OFF</button>
        </div>

        <div class="terminal" id="mainLog">> System Encrypted...<br>> Ready to Inject.</div>
        <button class="btn-prime" onclick="location.reload()" style="margin-top:15px; background:transparent; color:red; border:1px solid red; font-size:0.6rem;">LOGOUT / TERMINATE</button>
    </div>

    <script>
        // 1. LOGIC LOGIN
        function processLogin() {
            const user = document.getElementById('user').value;
            const log = document.getElementById('loginLog');
            if(!user) return alert("Masukkan Username!");

            log.innerHTML += `<br>> Verifying: ${user.toUpperCase()}...`;
            setTimeout(() => {
                log.innerHTML += `<br>> <span style="color:var(--neon-green)">ACCESS GRANTED!</span>`;
                document.getElementById('displayUser').innerText = user.toUpperCase();
                setTimeout(() => {
                    document.getElementById('authWrap').style.display = 'none';
                    document.getElementById('mainPanel').style.display = 'block';
                    startSystemLogic();
                }, 1000);
            }, 1500);
        }

        // 2. LOGIC LIVE MONITOR (Jam & Stats)
        function startSystemLogic() {
            // Jam Digital
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').innerText = now.toLocaleTimeString();
                
                // Randomize CPU & Ping agar terlihat hidup
                document.getElementById('cpuLoad').innerText = Math.floor(Math.random() * 15) + 5 + "%";
                document.getElementById('pingMs').innerText = Math.floor(Math.random() * 20) + 10 + "ms";
            }, 1000);
        }

        // 3. LOGIC TOGGLE BUTTONS
        let states = { emu: false, aim: false, esp: false };

        function toggleLogic(type) {
            const log = document.getElementById('mainLog');
            states[type] = !states[type];
            
            const btn = {
                emu: document.getElementById('btnEmu'),
                aim: document.getElementById('btnAim'),
                esp: document.getElementById('btnEsp')
            };

            if(states[type]) {
                btn[type].style.borderColor = "var(--neon-green)";
                btn[type].style.color = "var(--neon-green)";
                btn[type].innerText = type.toUpperCase() + ": ACTIVE";
                log.innerHTML += `<br>> [ENABLE] ${type.toUpperCase()} Protocol Success.`;
            } else {
                btn[type].style.borderColor = "var(--border-luxe)";
                btn[type].style.color = "#000";
                btn[type].innerText = type.toUpperCase() + ": OFF";
                log.innerHTML += `<br>> [DISABLE] ${type.toUpperCase()} Service Stopped.`;
            }
            log.scrollTop = log.scrollHeight; // Auto scroll terminal
        }
    </script>
</body>
</html>
