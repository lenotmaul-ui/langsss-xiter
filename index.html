<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERLAN LUXE PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Cinzel:wght@700&family=Orbitron:wght@700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Perhatikan: Ganti URL di bawah dengan link gambar asli Anda */
            --bg-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070'); 
            --glass: rgba(10, 10, 10, 0.75);
            --neon-green: #00ff88;
            --neon-blue: #00f2ff;
            --danger: #ff3b30;
            --border-luxe: rgba(255,255,255,0.12);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; }
        
        body { 
            background: #000;
            background-image: radial-gradient(circle at center, rgba(0,255,136,0.08) 0%, transparent 70%), linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; 
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; 
            padding: 40px 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        @keyframes luxeFade {
            from { opacity: 0; transform: scale(0.97) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .fade-in { animation: luxeFade 0.4s ease-out forwards; }

        .premium-container {
            width: 92vw; max-width: 390px; 
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--border-luxe); 
            border-radius: 40px; 
            padding: 30px 25px 20px 25px;
            z-index: 10;
            margin-bottom: 10px;
        }

        .status-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.03); padding: 8px 16px;
            border-radius: 100px; border: 1px solid var(--border-luxe);
            font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
            color: #888; text-transform: uppercase;
        }
        .dot { 
            width: 7px; height: 7px; border-radius: 50%; 
            background: var(--neon-green); 
            box-shadow: 0 0 12px var(--neon-green);
            animation: pulse-glow 2s infinite; 
        }
        @keyframes pulse-glow { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.4; transform: scale(0.9); } }
        
        .brand { text-align: center; margin-bottom: 30px; position: relative; }
        .brand .title { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 2rem; 
            letter-spacing: 6px; 
            font-weight: 900; 
            color: #fff;
            position: relative;
            display: inline-block;
            text-shadow: 0.05em 0 0 rgba(0, 255, 136, 0.75),
                        -0.025em -0.05em 0 rgba(0, 242, 255, 0.75),
                        0.025em 0.05em 0 rgba(255, 59, 48, 0.75);
            animation: glitch 500ms infinite;
        }
        .brand .title span { color: var(--neon-green); margin-left: 5px; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: rgba(255,255,255,0.04); padding: 6px; border-radius: 20px; }
        .tab-trigger { flex: 1; padding: 12px; border: none; background: transparent; color: #555; font-size: 0.65rem; font-weight: 800; cursor: pointer; transition: 0.3s; border-radius: 16px; }
        .tab-trigger.active { background: #fff; color: #000; box-shadow: 0 8px 20px rgba(255,255,255,0.15); }
        
        .input-wrap { position: relative; width: 100%; margin-bottom: 12px; display: flex; align-items: center; }
        input { width: 100%; padding: 18px 18px 18px 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-luxe); border-radius: 18px; color: #fff; font-size: 0.85rem; transition: 0.3s; }
        input:focus { border-color: var(--neon-green); background: rgba(0,255,136,0.05); }

        .input-icon { position: absolute; left: 15px; z-index: 10; color: rgba(255, 255, 255, 0.3); pointer-events: none; }
        .input-icon svg { width: 18px; height: 18px; }

        .btn-prime { 
            width: 100%; padding: 18px; background: #fff; color: #000; 
            border: none; border-radius: 20px; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; 
            transition: var(--transition);
        }
        .btn-prime:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2); }

        .social-group { display: flex; justify-content: center; gap: 25px; margin-top: 15px; }
        .support-link svg { width: 32px; height: 32px; transition: 0.3s; }
        .support-link:hover { transform: scale(1.2); }

        .terminal {
            margin-top: 20px; height: 100px;
            background: rgba(0, 0, 0, 0.9); border-radius: 20px;
            padding: 15px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; border: 1px solid var(--border-luxe);
            color: var(--neon-green); overflow-y: auto;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <div class="premium-container fade-in" id="authWrap">
        <div class="status-wrapper"><div class="status-badge"><div class="dot"></div> System Ready</div></div>
        <div class="brand"><div class="title">ERLAN<span>LUXE</span></div></div>
        
        <div class="nav-tabs">
            <button class="tab-trigger active" onclick="setAuthMode('login')">MASUK</button>
            <button class="tab-trigger" onclick="setAuthMode('register')">DAFTAR</button>
        </div>
        
        <div id="userInputs">
            <div class="input-wrap">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </span>
                <input type="text" id="user" placeholder="Nama Pengguna">
            </div>
            <div class="input-wrap">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
                <input type="password" id="pass" placeholder="Kata Sandi">
            </div>
        </div>

        <button class="btn-prime" id="mainAuthBtn" onclick="doAuth()">LOGIN TO SYSTEM</button>

        <div class="social-group">
            <a href="#" class="support-link">
                <svg fill="#25D366" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </a>
        </div>
        <div class="terminal" id="logArea">System Initialized... Waiting for input.</div>
    </div>

    <script>
        function setAuthMode(mode) {
            const btn = document.getElementById('mainAuthBtn');
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            btn.innerText = mode === 'login' ? 'LOGIN TO SYSTEM' : 'CREATE ACCOUNT';
        }

        function doAuth() {
            const log = document.getElementById('logArea');
            log.innerHTML += "<br>> Authenticating...";
            // Logika fetch Anda di sini
        }

        // Particle Script
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
